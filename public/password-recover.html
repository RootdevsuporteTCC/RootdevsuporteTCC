<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT DEV - Recuperação de senha</title>

    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/cadastro-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" href="./img/folder-icon.png" type="image/png">
</head>
<body>
    <header>
        <nav>
            <div class="tittle">
                <a href="index.html">
                    <h1><i class="fa-solid fa-folder"></i>/ROOT_DEV</h1>
                </a>
            </div>
            <div id="auth-buttons">
                <a href="login.html">
                    <button>Login</button>
                </a> 
                <a href="cadastro.html">
                    <button>Cadastro</button>
                </a> 
            </div>
            <div id="nav-drawer-container">
                <div id="nav-drawer">
                    <i class="fa-solid fa-bars" id="menu-icon" onclick="toggleMenu()"></i>
                </div>
            </div>
        </nav>
        <div id="nav-drawer-menu" class="menu-fechado">
            <a href="login.html">
                <button>Login</button>
            </a> 
            <a href="cadastro.html">
                <button>Cadastro</button>
            </a> 
        </div>
    </header>

    <div id="form-box">
        <form action="" class="white-text">
            <h1 class="disket-font">RECUPERAR SENHA</h1>
            <div class="campo">
                <label for="email-tel">E-Mail ou telefone cadastrado:</label><br>
                <div class="input">
                    <input id="email-tel" name="email-tel" type="text" required placeholder="  /  jao@email.com">
                </div>
            </div>
            
            <div id="form-confirm">
                <button type="submit" class="main-button disket-font">Verificar</button>
                <p>Lembrou sua senha? <a href="login.html"><span>Entrar</span></a></p>
            </div>
        </form>
    </div>

    <footer>
        <div class="content-block" id="contato">
            <h1 class="disket-font">CONTATO:</h1>
            <p>E-mail: <span onclick="emailToClipboard()">rootdevsuporte@gmail.com</span></p>
        </div>
    </footer>
</body>

<script src="../scripts/nav-drawer.js"></script>
<script src="../scripts/email-to-clipboard.js"></script>

</html>
