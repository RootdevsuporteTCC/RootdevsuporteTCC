<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT DEV - Cadastro</title>
    
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/cadastro-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" href="./img/folder-icon.png" type="image/png" >
</head>
<body>
    <header>
        <nav>
            <div class="title">
                <a href="/">
                    <h1><i class="fa-solid fa-folder"></i>/ROOT_DEV</h1>
                </a>
            </div>
            <div id="auth-buttons">
                <a href="login.html">
                    <button>Login</button>
                </a> 
                <a href="cadastro.html">
                    <button>Cadastro</button>
                </a> 
            </div>
            <div id="nav-drawer-container">
                <div id="nav-drawer">
                    <i class="fa-solid fa-bars" id="menu-icon" onclick="toggleMenu()"></i>
                </div>
            </div>
        </nav>
        <div id="nav-drawer-menu" class="menu-fechado">
            <a href="login.html">
                <button>Login</button>
            </a> 
            <a href="cadastro.html">
                <button>Cadastro</button>
            </a> 
        </div>
    </header>

    <div id="form-box">
        <form action="/usuarios" method="POST" class="white-text" id="formCadastro">
            <h1 class="disket-font">CADASTRO</h1>
            <div class="campo">
                <label for="nome">Nome de Usuário:</label>
                <div>
                    <input id="nome" name="nome" type="text" required placeholder="JoaozinhoLegau123"> <span class="required">*</span>
                </div>
            </div>

            <div class="campo">    
                <label for="email">E-Mail:</label>
                <div>
                    <input id="email" name="email" type="email" required placeholder="joaozinho@email.com"> <span class="required">*</span>
                </div>
            </div> 

            <div class="campo">    
                <label for="telefone">Telefone (opcional):</label> 
                <div>
                    <input id="telefone" name="telefone" type="tel" placeholder="(99) 12345-6789"> <span class="hidden">*</span>
                </div>
            </div> 

            <div class="campo">    
                <label for="senha">Senha:</label> 
                <div>
                    <input id="senha" name="senha" type="password" required  placeholder="senhaforte321"> <span class="required">*</span>
                </div>
            </div> 

            <div class="campo">    
                <label for="confirmar-senha">Confirmar Senha:</label> 
                <div>
                    <input id="confirmar-senha" name="confirmar-senha" type="password" required placeholder="senhaforte321"> <span class="required">*</span>
                </div>
            </div>

            <div class="campo">    
                <label for="avatar">Digite um Avatar:</label> 
                <div>
                    <input id="avatar" name="avatar" type="text" placeholder=":D"> <span class="hidden">*</span>
                </div>
            </div>

            <div id="form-confirm">
                <p>Já possui uma conta? <a href="login.html"><span>Entrar</span></a></p>
                <button type="submit" class="main-button disket-font">Cadastrar</button>
            </div>
        </form>
    </div>

    <footer>
        <div class="content-block" id="contato">
            <h1 class="disket-font">CONTATO:</h1>
            <p>E-mail: <span onclick="emailToClipboard()">rootdevsuporte@gmail.com</span></p>
        </div>
    </footer>
</body>

<script src="./scripts/nav-drawer.js"></script>
<script src="./scripts/email-to-clipboard.js"></script>
<script src="./scripts/verificar-cadastro.js"></script>

</html>
