    <div id="form-box"> <!--alterar o action do form para puxar os dados do usuário-->
        <form action="/usuarios/cadastro" method="POST" class="white-text" id="formCadastro">
            <h1 class="disket-font">Perfil</h1>
            <div class="campo">
                <!--alterar o value do input para puxar os dados do usuário-->
                <label for="nome">Nome de Usuário:</label>
                <div>
                    <input id="nome" name="nome" type="text" required placeholder="Seu Nome">
                </div>
            </div>

            <div class="campo">    
                <label for="email">E-Mail:</label>
                <div>
                    <input id="email" name="email" type="email" required placeholder="SeuEmail@email.com">
                </div>
            </div> 

            <div class="campo">    
                <label for="telefone">Telefone (opcional):</label> 
                <div>
                    <input id="telefone" name="telefone" type="tel" placeholder="Seu telefone"> 
                </div>
            </div> 

            <div class="campo">    
                <label for="avatar">Digite um Avatar:</label> 
                <div>
                    <input id="avatar" name="avatar" type="text" placeholder=":D" maxlength="10">
                </div>
            </div>

            <div id="form-confirm">
                <button type="submit" class="main-button disket-font"><a href="/index.html">ALTERAR</a></button>
            </div>
        </form>
    </div>
